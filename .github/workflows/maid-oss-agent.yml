name: MAID Groq OSS Autopilot Pilot
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/maid-oss-agent.yml
      - opencode.json
      - scripts/maid_oss_guard.py
      - tests/test_maid_oss_guard.py
  pull_request:
    paths:
      - .github/workflows/maid-oss-agent.yml
      - opencode.json
      - scripts/maid_oss_guard.py
      - tests/test_maid_oss_guard.py
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: maid-oss-pilot
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Negative authorization tests
        run: python3 -m unittest discover -s tests -p 'test_maid_oss_*.py' -v
      - name: Static source checks
        run: |
          python3 -m py_compile scripts/maid_oss_guard.py
          python3 -m json.tool opencode.json >/dev/null
          test -s docs/maid/OSS_AUTOPILOT_RUNBOOK.md
  model-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenCode 1.19.3
        run: npm install --global opencode-ai@1.19.3
      - name: Verify configured Groq key
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo '::error::GROQ_API_KEY repository Actions secret is missing; free-tier Groq account key must be configured securely.'
            exit 1
          fi
          echo 'GROQ_KEY_CONFIGURED (value never logged)' >> "$GITHUB_STEP_SUMMARY"
      - name: Test real Groq Qwen 3.8 27B inference with OpenCode
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          timeout 180s opencode run --pure -m groq/qwen/qwen3.8-27b 'Return exactly MAID_QWEN38_CODE_READY and nothing else.' | tee /tmp/groq-smoke.txt
          grep -q MAID_QWEN38_CODE_READY /tmp/groq-smoke.txt
          echo 'QWEN38_CODING_SMOKE_PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  authorize-pilot:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.verify.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail-closed verify exact owner issue 16 comment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/maid_oss_guard.py --event "$GITHUB_EVENT_PATH"; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
            echo 'OWNER_PILOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'OWNER_PILOT_REJECTED: no execution' >> "$GITHUB_STEP_SUMMARY"
          fi
  pilot-coding:
    needs: authorize-pilot
    if: needs.authorize-pilot.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner-only issue request and negative cases
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maid_oss_guard.py --event "$GITHUB_EVENT_PATH"
          python3 -m unittest discover -s tests -p 'test_maid_oss_*.py' -v
      - name: Create isolated pilot branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = karanzing1992/airo
          branch="autopilot/pilot-16-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          echo "MAID_AGENT_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Run Groq Qwen 3.8 coding agent (bounded docs-only pilot)
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo '::error::GROQ_API_KEY repository Actions secret missing; pilot not executed.'
            exit 1
          fi
          npm install --global opencode-ai@1.19.3
          timeout 420s opencode run --pure --agent build -m groq/qwen/qwen3.8-27b 'You are the GitHub issue #16 MAID coding agent. Read docs/maid/OSS_AUTOPILOT_RUNBOOK.md. USE YOUR FILE EDIT/WRITE TOOL, not merely a chat reply, to CREATE exactly one new file docs/maid/AUTOPILOT_PILOT_RESULT.md. Markdown headings: Objective, Architecture, Model, Security, Test Plan, Open Blockers. Accurately explain the strong Groq model, owner authorization, CI, the prior local-model pilot failure, evidence limitations and steps to verify real future runs. Do not assert deployments or certification. Do not edit other files. Do not run shell commands or web requests. Under 16KB. Write the file now.' | tee /tmp/maid-groq-output.txt
      - name: Fail-closed review of generated changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maid_oss_guard.py --validate-diff
          git diff --check
          grep -q '^#' docs/maid/AUTOPILOT_PILOT_RESULT.md
          echo "PILOT_DIFF_VALIDATED: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Push only reviewed pilot file and open draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/maid/AUTOPILOT_PILOT_RESULT.md
          git diff --cached --check
          git commit -m 'docs: MAID Groq Qwen 3.8 autonomous coding pilot (#16)'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$MAID_AGENT_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$MAID_AGENT_BRANCH" --draft --title 'MAID Groq Qwen 3.8 autopilot pilot: issue #16' --body 'Verifies owner-gated issue-to-PR coding using strong Groq Qwen 3.8 27B within approved quota. Generated artifact only; no production deploy or certification. Requires independent source/CI review before merge. Refs #16.'
          echo "DRAFT_PR_CREATED: $MAID_AGENT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
